<title>Tutorial Studio Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: desktop app shell. Slim prototype bar, app header, then one screen per view; the Studio is Script | Preview | Inspector over a 3-lane timeline. */
:root{
  --bg:#F3F3F3; --surface:#FFFFFF; --sunk:#F3F3F3; --line:#D7D7D7; --ink:#13213B; --muted:#56607A; --faint:#8A92A5;
  --accent:#FF5800; --accent-ink:#B84300; --accent-soft:#FFEADC; --steel:#4F7AA3; --steel-soft:#E3ECF5;
  --ok:#1E7A46; --ok-soft:#E3F4EA; --warn:#9A5B00; --warn-soft:#FFF3D6; --bad:#B3261E; --bad-soft:#FCE8E6;
  --on-fill:#FFFFFF; --navy-fill:#13213B; --shadow:0 8px 28px rgba(19,33,59,.14);
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --r-sm:9px; --r-xs:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --surface:#162139; --sunk:#111B2F; --line:#2A3853; --ink:#E7ECF4; --muted:#A6B1C5; --faint:#7C879C;
  --accent:#FF6A1A; --accent-ink:#FF9A5C; --accent-soft:#3A2517; --steel:#8DB3D8; --steel-soft:#1C2B41;
  --ok:#7BD3A0; --ok-soft:#173326; --warn:#F2C46B; --warn-soft:#3A2F17; --bad:#FF8A80; --bad-soft:#3A1C21;
  --on-fill:#FFFFFF; --navy-fill:#E7ECF4; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#162139; --sunk:#111B2F; --line:#2A3853; --ink:#E7ECF4; --muted:#A6B1C5; --faint:#7C879C;
  --accent:#FF6A1A; --accent-ink:#FF9A5C; --accent-soft:#3A2517; --steel:#8DB3D8; --steel-soft:#1C2B41;
  --ok:#7BD3A0; --ok-soft:#173326; --warn:#F2C46B; --warn-soft:#3A2F17; --bad:#FF8A80; --bad-soft:#3A1C21;
  --on-fill:#FFFFFF; --navy-fill:#E7ECF4; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.app{min-height:100%;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* prototype bar */
.proto{background:var(--steel-soft);color:var(--steel);font-size:12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding-block:6px;border-bottom:1px solid var(--line)}
.proto b{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.proto button{background:none;border:0;color:var(--steel);font-weight:600;cursor:pointer;padding:2px 6px;border-radius:6px}
.proto button[aria-current="page"]{background:var(--surface);color:var(--ink)}
.proto .sp{flex:1}

/* header */
.hdr{background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;min-height:56px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;background:none;border:0;cursor:pointer;padding:0}
.mark{width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--on-fill);font-size:13px;font-weight:800}
.nav{display:flex;gap:2px}
.nav button{background:none;border:0;padding:7px 12px;border-radius:var(--r-sm);font-weight:600;color:var(--muted);cursor:pointer}
.nav button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.hdr .grow{flex:1}
.crumb{display:flex;align-items:center;gap:8px;min-width:0}
.crumb .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save{font-size:12px;color:var(--ok);display:flex;align-items:center;gap:5px}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-fill);font-weight:700;font-size:15px}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.lg{padding:12px 22px;font-size:16px}
.ico{width:16px;height:16px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.need{background:var(--accent-soft);color:var(--accent-ink)}
.chip.run{background:var(--steel-soft);color:var(--steel)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.eb{font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-weight:600;font-size:13px}
input[type=text],input[type=number],input[type=password],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;width:100%}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--r-sm);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.switch{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.switch input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}

/* home */
.home{max-width:980px;margin:0 auto;width:100%;padding-block:44px 64px;display:flex;flex-direction:column;gap:34px}
.setupbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 16px}
.setupbar b{color:var(--ink)}
.hero{display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:clamp(30px,4.6vw,46px);font-weight:800;line-height:1.08}
.hero h1 i{font-style:normal;color:var(--accent)}
.maker{padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);border:0}
.maker textarea{font-size:18px;border:0;padding:6px 2px;min-height:64px;background:transparent}
.maker textarea:focus{outline:0}
.maker .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.how button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.how button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.how b{font-size:14px}
.how span{font-size:12.5px;color:var(--muted)}
.est{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);align-items:center}
.est b{color:var(--ink)}
.go{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
details.custom summary{cursor:pointer;font-weight:600;color:var(--steel);list-style:none;display:inline-flex;align-items:center;gap:6px}
details.custom summary::-webkit-details-marker{display:none}
details.custom[open] summary .car{transform:rotate(90deg)}
.car{display:inline-block;transition:transform .15s}
.customgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:14px}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tcard{text-align:left;cursor:pointer;padding:0;overflow:hidden;display:flex;flex-direction:column}
.tcard:hover{border-color:var(--faint)}
.tcard .thumb{aspect-ratio:16/9;background:#F7F8FA;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.tcard .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tcard .body b{font-size:14.5px}

/* making */
.making{flex:1;display:grid;grid-template-columns:260px minmax(0,1fr) 340px;gap:16px;padding-block:18px;min-height:0}
@media (max-width:1100px){.making{grid-template-columns:minmax(0,1fr)}}
.stages{padding:18px;display:flex;flex-direction:column;gap:4px;align-self:start}
.stage{display:grid;grid-template-columns:26px 1fr;gap:2px 10px;padding:8px 0;align-items:start}
.stage .m{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted);margin-top:1px}
.stage.done .m{background:var(--ok);border-color:var(--ok);color:var(--on-fill)}
.stage.now .m{border-color:var(--accent);color:var(--accent)}
.stage.you .m{border-color:var(--steel);color:var(--steel)}
.stage b{font-size:14px}
.stage .s{grid-column:2;font-size:12.5px;color:var(--muted)}
.stage.now b{color:var(--accent-ink)}
.bar{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;grid-column:2;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.livecol{display:flex;flex-direction:column;gap:12px;min-width:0}
.livebox{padding:14px;display:flex;flex-direction:column;gap:10px}
.nowline{display:flex;align-items:center;gap:10px;font-weight:600}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,88,0,.45)}100%{box-shadow:0 0 0 10px rgba(255,88,0,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.needcard{border:2px solid var(--accent);padding:16px;display:flex;flex-direction:column;gap:10px}
.needcard h3{font-size:16px}
.feed{padding:16px;display:flex;flex-direction:column;gap:8px}
.feed ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}
.feed li{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:13px}
.feed li .ck{color:var(--ok);font-weight:800}
.tech{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--sunk);border-radius:var(--r-xs);padding:10px;display:flex;flex-direction:column;gap:3px}
.review{display:flex;flex-direction:column;gap:10px}
.rstep{padding:14px 16px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 12px}
.rstep .n{width:26px;height:26px;border-radius:8px;background:var(--navy-fill);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:12px}
.rstep.ex .n{background:var(--accent);color:var(--on-fill)}
.rstep textarea{grid-column:2;min-height:54px}
.rstep .meta{grid-column:2;font-size:12px;color:var(--muted)}
.donecard{padding:30px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.donecard h2{font-size:28px;font-weight:800}

/* studio */
.studio{flex:1;display:grid;grid-template-columns:320px minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) auto;min-height:0;gap:12px;padding-block:12px}
@media (max-width:1100px){.studio{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}}
.col{min-height:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.script{display:flex;flex-direction:column;min-height:0;flex:1}
.script .head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.script .head h2{font-size:15px}
.slist{overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:2px;min-height:0;flex:1}
.app.fixed{height:100%;overflow:hidden}
.app.fixed .studio{min-height:0}
.app.fixed .col{min-height:0}
.app.fixed .agent{flex:none;max-height:46%;overflow:auto}
@media (max-width:1100px){.app.fixed{height:auto;overflow:visible}.slist{max-height:60vh}}
.srow{border-radius:var(--r-sm);padding:8px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 8px;border:1.5px solid transparent}
.srow.cur{background:var(--accent-soft)}
.srow.sel{border-color:var(--accent)}
.srow .tm{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:none;border:0;padding:2px 0;cursor:pointer;text-align:left}
.srow .ti{font-weight:700;font-size:13px;cursor:pointer}
.srow textarea{grid-column:2;border:1px solid transparent;background:transparent;padding:4px 6px;margin-left:-6px;font-size:13px;line-height:1.45;color:var(--ink);min-height:0;resize:none;overflow:hidden}
.srow textarea:hover{border-color:var(--line)}
.srow .acts{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.srow .tag{font-size:11px;font-weight:700;color:var(--accent-ink)}
.warnrow{grid-column:2;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:var(--r-xs);padding:4px 8px}
.warnrow button{margin-left:auto}
.agent{padding:12px;display:flex;flex-direction:column;gap:8px}
.agent .top{display:flex;align-items:center;justify-content:space-between}
.agent h2{font-size:14px}
.agent textarea{min-height:44px;font-size:13px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--muted)}
.notechips{display:flex;flex-wrap:wrap;gap:6px}
.result{border:1.5px solid var(--steel);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--steel-soft)}
.result .rb{display:flex;gap:6px;flex-wrap:wrap}

.center{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--sunk);border-radius:var(--r);padding:12px;position:relative}
.stagebox{position:relative;width:100%;max-width:min(100%, calc((100vh - 430px) * 16 / 9));aspect-ratio:16/9;border-radius:8px;overflow:hidden;box-shadow:var(--shadow);user-select:none;background:#FFFFFF}
@media (max-width:1100px){.stagebox{max-width:100%}}
.stagebox.notemode{cursor:crosshair}
.addbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.addbar .grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px}
.addbar .grp .gl{font-size:11px;font-weight:700;color:var(--muted);padding:0 6px;text-transform:uppercase;letter-spacing:.08em}
.addbar .grp button{border:0;background:none;border-radius:7px;padding:5px 9px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.addbar .grp button:hover{background:var(--sunk)}
.addbar .grp button[aria-pressed="true"]{background:var(--steel-soft);color:var(--steel)}
.transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.play{width:38px;height:38px;border-radius:50%;background:var(--accent);border:0;color:var(--on-fill);display:grid;place-items:center;cursor:pointer}
.tc{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}

/* fixed "video" world (always light, it is the recording) */
.vs{position:absolute;inset:0;display:grid;grid-template-columns:5% 22% 1fr;grid-template-rows:7% 1fr 5%;font-family:var(--sans);color:#1F2937;background:#FFFFFF}
.vs .tb{grid-column:1/-1;background:#F3F3F3;border-bottom:1px solid #E1E1E1;display:flex;align-items:center;justify-content:center;font-size:1.1cqw;color:#666}
.vs .ab{background:#F3F3F3;border-right:1px solid #E1E1E1}
.vs .ex{background:#F8F8F8;border-right:1px solid #E1E1E1;padding:1.2cqw;font-size:1cqw;display:flex;flex-direction:column;gap:.6cqw;color:#444}
.vs .ex .hi{background:#E4E9F2;border-radius:3px;padding:.2cqw .5cqw;color:#13213B;font-weight:600}
.vs .ed{position:relative;padding:2cqw;display:flex;flex-direction:column;gap:1.4cqw}
.vs .sb{grid-column:1/-1;background:#4F7AA3;color:#fff;font-size:.9cqw;display:flex;align-items:center;padding:0 1cqw}
.vs .crumbs{font-size:1cqw;color:#777}
.vs h4{margin:0;font-size:1.8cqw;color:#13213B}
.vs .form{display:flex;flex-direction:column;gap:1cqw;max-width:60%}
.vs .inp{border:1px solid #CCD2DC;border-radius:4px;height:3cqw;padding:0 1cqw;display:flex;align-items:center;font-size:1.1cqw;color:#333;background:#fff}
.vs .vbtn{align-self:flex-start;background:#13213B;color:#fff;border-radius:4px;padding:.8cqw 1.6cqw;font-size:1.1cqw;font-weight:600}
.vs .canvas{flex:1;position:relative;background-image:radial-gradient(#D7DCE5 1px,transparent 1px);background-size:1.6cqw 1.6cqw;border:1px solid #E6E8EE;border-radius:6px}
.vs .node{position:absolute;border:1.5px solid #13213B;background:#fff;border-radius:6px;padding:.8cqw 1.2cqw;font-size:1.1cqw;font-weight:600;color:#13213B}
.vs .node small{display:block;font-weight:400;color:#777;font-size:.9cqw}
.vs .chat{position:absolute;right:3%;bottom:6%;width:42%;border:1px solid #D7DCE5;border-radius:8px;background:#fff;padding:1cqw;display:flex;flex-direction:column;gap:.8cqw;font-size:1.05cqw}
.vs .chat .u{align-self:flex-end;background:#13213B;color:#fff;border-radius:8px;padding:.5cqw 1cqw}
.vs .chat .a{background:#F1F3F7;border-radius:8px;padding:.5cqw 1cqw;color:#222}
.vs .term{position:absolute;left:0;right:0;bottom:0;height:34%;background:#1E1E1E;color:#D4D4D4;font-family:var(--mono);font-size:1cqw;padding:1cqw;display:flex;flex-direction:column;gap:.4cqw}
.stagebox{container-type:inline-size}
.exp{position:absolute;inset:0;background:radial-gradient(120% 120% at 20% 0%,#22355A 0%,#13213B 60%,#0C1526 100%);color:#fff;padding:5cqw;display:flex;flex-direction:column;gap:4cqw}
.exp .k{font-size:1.1cqw;letter-spacing:.2em;color:#FF8A4C;font-weight:700}
.exp h4{margin:0;font-size:3.6cqw;font-weight:800}
.exp h4 i{font-style:normal;color:#FF5800}
.exp .flowx{display:flex;gap:2cqw;align-items:center}
.exp .bx{flex:1;border:1.5px solid rgba(255,255,255,.35);border-radius:1cqw;padding:1.6cqw;font-size:1.4cqw;font-weight:700;transition:none}
.exp .bx small{display:block;font-family:var(--mono);font-weight:400;font-size:1cqw;opacity:.7;margin-top:.6cqw}
.exp .bx.on{border-color:#FF5800;background:rgba(255,88,0,.16)}
.exp .ar{opacity:.6;font-size:1.8cqw}
.cap{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);max-width:80%;background:rgba(12,21,38,.82);color:#fff;font-size:1.5cqw;padding:.6cqw 1.4cqw;border-radius:.6cqw;text-align:center;line-height:1.35}
.cursor{position:absolute;width:2.2cqw;height:2.2cqw;pointer-events:none}
.ov{position:absolute;cursor:grab;outline-offset:3px}
.ov.sel{outline:2px dashed #4F7AA3}

  }

  let body='';
  if(i<=1) body = `<div class="crumbs">Greeting Service › Artifacts › Chat Agent Service</div><h4>Create Chat Agent Service</h4><div class="form"><div class="inp">${i===0?'':'math-tutor'}</div><div class="inp" style="height:6cqw;align-items:flex-start;padding-top:.8cqw">${i===0?'':'You are a patient math tutor…'}</div><div class="vbtn">Create</div></div>`;
  else if(i<=6) body = `<div class="crumbs">math-tutor › Agent</div><div class="canvas"><div class="node" style="left:8%;top:30%">Chat<small>/math-tutor/chat</small></div><div class="node" style="left:36%;top:30%">Agent<small>Math tutor</small></div><div class="node" style="left:64%;top:12%">Model<small>gpt-4o</small></div><div class="node" style="left:64%;top:52%">Tools<small>${i>=4?(i>=6?'sum, subtract, multiply, divide':'sum'):'none'}</small></div></div>`;

}

let mkTimer=null;
function mkTick(){
  const m=S.mk; if(S.view!=='making'||m.need||m.done) return;
  const st=STAGES[m.stage]; m.pct=Math.min(100,m.pct+3.2);
  const n=st.logs?Math.min(st.logs.length,Math.floor(m.pct/100*st.logs.length)+1):0;
  const base=STAGES.slice(0,m.stage).reduce((a,s)=>a+(s.logs?s.logs.length:0),0);
  while(m.log.length<base+n) m.log.push(st.logs[m.log.length-base]);
  if(m.stage===1&&m.pct>55&&!m.askedPerm){m.askedPerm=true;m.need='perm';notify('The agent needs your OK to install packages.');}
  if(m.pct>=100){ m.stage++; m.pct=0;
    if(m.stage>=STAGES.length){m.done=true;notify('Your tutorial is ready to watch and edit.','studio');}
    else if(STAGES[m.stage].you){m.need='script';notify('Check the script before it is voiced.');}
  }
  render();
}

    if(o.type==='title') h+=`<div class="ov title${sel}" data-ov="${o.id}"><span class="k">WSO2 INTEGRATOR</span><h4>${esc(o.text)}<i>.</i></h4></div>`;
    else if(o.type==='arrow') h+=`<div class="ov arrow${sel}" data-ov="${o.id}" style="${pos}" aria-label="Arrow overlay">${arrowSvg(o.color)}</div>`;
    else if(o.type==='box') h+=`<div class="ov box${sel}" data-ov="${o.id}" style="${pos};border-color:${o.color}"></div>`;
    else if(o.type==='text') h+=`<div class="ov text${sel}" data-ov="${o.id}" style="${pos};background:${o.color};color:${o.color==='#FFFFFF'?'#13213B':'#fff'}">${esc(o.text)}</div>`;
    else if(o.type==='callout') h+=`<div class="ov callout${sel}" data-ov="${o.id}" style="${pos};border-color:${o.color}">${esc(o.text)}</div>`;
    else if(o.type==='zoom') h+=`<div class="ov zoom${sel}" data-ov="${o.id}" style="${pos}"><span>Zoom ${o.zoomLevel||2}×</span></div>`;
    else h+=`<div class="ov ${o.type}${sel}" data-ov="${o.id}" style="${pos}"></div>`;
  });

  const s=stepAt(S.t);

}

function timeline(){
  const ticks=[];for(let t=0;t<=DUR;t+=15) ticks.push(`<span style="left:${pct(t)}">${mmss(t)}</span>`);

  if(S.lanes.steps) lanes.push(['Steps']); if(S.lanes.captions) lanes.push(['Captions']); if(S.lanes.notes&&S.agent.notes.length) lanes.push(['Notes']);
  const video=S.clips.map(c=>`<button class="blk ${c.kind==='ex'?'exb':'rec'}${c.speed>1?' fast':''}${isSel('clip',c.id)}" data-sel="clip" data-id="${c.id}" style="left:${pct(c.s)};width:calc(${pct(c.e-c.s)} - 2px)" aria-label="${c.kind==='ex'?'Explainer':'Recording'} ${mmss(c.s)} to ${mmss(c.e)}${c.speed>1?', '+c.speed+' times speed':''}">${c.kind==='ex'?'Explainer · '+esc(c.look):'Recording'}${c.speed>1?` <span class="sp">${c.speed}×</span>`:''}</button>`).join('');
  const vo=S.steps.map(s=>`<button class="blk vo${S.orig[s.id]!==s.line?' changed':''}${isSel('line',s.id)}" data-sel="line" data-id="${s.id}" style="left:${pct(s.t)};width:calc(${pct(voLen(s))} - 2px)" title="${esc(s.line)}">${esc(s.line)}</button>`).join('');
  const ov=S.ovs.map(o=>`<button class="blk ovb${isSel('ov',o.id)}" data-sel="ov" data-id="${o.id}" style="left:${pct(o.s)};width:max(56px,calc(${pct(o.e-o.s)} - 2px))">${OVNAME[o.type]}</button>`).join('');
  const stp=S.steps.map((s,i)=>`<button class="blk stp" data-act="seek" data-t="${s.t}" style="left:${pct(s.t)};width:calc(${pct(stepEnd(i)-s.t)} - 2px)">${i+1} · ${esc(s.title)}</button>`).join('');

  return `<section class="panel tl" aria-label="Timeline"><div class="tlbar">
    <button class="btn sm" data-act="split" title="Split the selected video part at the playhead (S)">Split</button>

    <div class="menuwrap"><button class="btn sm" data-act="menu" data-m="auto" aria-haspopup="true" aria-expanded="${S.menu==='auto'}">Automatic edits</button>${S.menu==='auto'?`<div class="menu" role="menu"><button role="menuitem" data-act="dialog" data-d="revoiceall">Update the voice-over<span>Re-voices the ${changedCount()||'no'} changed line${changedCount()===1?'':'s'}. Asks before re-timing.</span></button><button role="menuitem" data-act="dialog" data-d="lineup">Line up clicks with the voice<span>Speeds up or holds the video so each click lands on its word.</span></button><button role="menuitem" data-act="dialog" data-d="rebuild">Rebuild the cursor and click effects<span>Your own overlays are kept.</span></button></div>`:''}</div>
    <span class="grow"></span>

const DIALOGS = {

// ---------- render ----------
function render(){
  const v=S.view; let body='';
  if(v==='home') body=viewHome(); else if(v==='making') body=viewMaking(); else if(v==='studio') body=viewStudio(); else if(v==='export') body=viewExport(); else body=viewSetup();
  const ae=document.activeElement, aid=ae&&ae.id, ss=ae&&ae.selectionStart, sl=$('#slist')?.scrollTop, sc=$('#scroller')?.scrollLeft;
  $('#app').innerHTML=protoBar()+body; $('#app').className='app'+(v==='studio'?' fixed':'');

  renderLayer();
}
function autosize(t){t.style.height='auto';t.style.height=t.scrollHeight+'px';}
function renderLive(){ // playback: update only the preview, timecode, playhead, current step
  const st=$('#stage'); if(!st) return;
  st.innerHTML=stageInner(); const tc=$('#tc'); if(tc) tc.textContent=`${mmss(S.t,1)} / ${mmss(DUR)}`;
  const ph=$('#ph'); if(ph) ph.style.left=pct(S.t);
  const cur=stepAt(S.t); document.querySelectorAll('.srow').forEach(r=>r.classList.toggle('cur',r.dataset.row===cur.id));
}
let raf=null,last=0;
function loop(ts){ if(!S.playing){raf=null;return;} const dt=last?(ts-last)/1000:0; last=ts;
  const c=S.clips.find(c=>S.t>=c.s&&S.t<c.e); S.t+=dt*(c?Math.min(c.speed,1.5):1)*(c&&c.speed>1?2:1);
  if(S.t>=DUR){S.t=DUR;S.playing=false;render();return;} renderLive(); raf=requestAnimationFrame(loop);}
function setPlay(p){S.playing=p;last=0;if(p&&!raf)raf=requestAnimationFrame(loop);const b=document.querySelector('[data-act="play"]');if(b){b.innerHTML=p?I.pause:I.play;b.setAttribute('aria-label',(p?'Pause':'Play')+' (Space)');}}
function seek(t){S.t=Math.max(0,Math.min(DUR,t));renderLive();}

// ---------- actions ----------
let nid=10;
function addOverlay(k){
  snap(`Add ${OVNAME[k].toLowerCase()}`);
  const o={id:'o'+(nid++),type:k,s:Math.round(S.t*2)/2,e:Math.round(S.t*2)/2+4,text:k==='text'?'Click Create':k==='callout'?'This is the agent':'' ,x:40,y:40,color:k==='text'?'#13213B':'#FF5800'};
  S.ovs.push(o);S.sel={kind:'ov',id:o.id};S.menu=null;render();toast(`Added ${OVNAME[k].toLowerCase()} at ${mmss(o.s)}. Drag it on the video.`,true);
}
function agentSend(){
  const a=S.agent;const txt=($('#ask')?.value||'').trim();
  if(!txt&&!a.notes.length){toast('Type what you want changed, or point at the video first.');return;}
  a.text='';a.state='working';a.working='Looking at step 3 and the Create button…';render();
  setTimeout(()=>{a.working='Adding an arrow and checking it on 6 frames…';render();},1200);
  setTimeout(()=>{snap('agent change');const o={id:'o'+(nid++),type:'arrow',s:24,e:30,text:'',x:47,y:58,color:'#FF5800'};
    if(!/arrow|create/i.test(txt)){o.type='callout';o.text=txt.slice(0,40)||'Look here';o.s=Math.round(S.t);o.e=o.s+5;o.x=a.notes[0]?.x||40;o.y=a.notes[0]?.y||40;}
    S.ovs=S.ovs.filter(x=>!(x.type==='arrow'&&x.id==='o2'&&o.type==='arrow'));S.ovs.push(o);
    a.result={title:o.type==='arrow'?'Added an arrow pointing at Create':'Added a callout',body:o.type==='arrow'?'It appears as the narrator says "Click Create" in step 3 and follows the button.':'Placed where you pointed, for 5 seconds.',t:o.s,ov:o.id};
    a.notes=[];a.state='result';S.t=o.s+1;S.sel={kind:'ov',id:o.id};render();},2600);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-sel],[data-ov]');
  // close menus on outside click
  if(S.menu&&!e.target.closest('.menuwrap')){S.menu=null;render();}
  if(!el) return;
  const act=el.dataset.act, d=el.dataset;
  if(el.dataset.sel&&!act){S.sel={kind:d.sel,id:d.id};if(d.sel==='line'){const s=S.steps.find(x=>x.id===d.id);S.t=s.t+0.2;}else if(d.sel==='ov'){const o=S.ovs.find(x=>x.id===d.id);if(S.t<o.s||S.t>=o.e)S.t=o.s+0.5;}else{const c=S.clips.find(x=>x.id===d.id);if(S.t<c.s||S.t>=c.e)S.t=c.s+0.5;}render();return;}
  switch(act){
    case 'jump': {const v=d.v; if(v==='check'){Object.assign(S.mk,{stage:2,pct:0,need:'script',done:false,log:[...STAGES[0].logs,...STAGES[1].logs],askedPerm:true});go('making');} else if(v==='making'){Object.assign(S.mk,{stage:0,pct:0,need:null,done:false,log:[],askedPerm:false});go('making');} else go(v);break;}
    case 'go': if(d.x==='review'){Object.assign(S.mk,{stage:5,done:true,need:null,log:STAGES.flatMap(s=>s.logs||[])});} go(d.v); break;
    case 'drawer': S.drawer=!S.drawer; renderLayer(); break;
    case 'toast': toast(d.msg); break;
    case 'sugg': S.goal=d.s; render(); $('#goal')?.focus(); break;
    case 'how': S.how=d.v; S.goal=$('#goal').value; render(); break;
    case 'card': if(d.d==='studio'){S.title=d.t;go('studio');} else if(d.d==='check'){Object.assign(S.mk,{title:d.t,stage:2,pct:0,need:'script',done:false,log:[...STAGES[0].logs,...STAGES[1].logs],askedPerm:true});go('making');} else {Object.assign(S.mk,{title:d.t,stage:3,pct:30,need:null,done:false,log:[...STAGES[0].logs,...STAGES[1].logs,STAGES[3].logs[0]],askedPerm:true});go('making');} break;
    case 'mkskip': S.mk.pct=99; mkTick(); break;
    case 'mkdetails': S.mk.details=!S.mk.details; render(); break;
    case 'perm': S.mk.need=null; S.mk.log.push(d.v==='allow'?'You allowed npm install':'You said no to npm install, so it used the existing packages'); toast(d.v==='allow'?'Allowed. The agent continues.':'Denied. The agent will work around it.'); render(); break;
    case 'approve': S.mk.need=null; S.mk.stage=3; S.mk.pct=0; S.mk.log.push('You approved the script'); toast('Approved. Recording now, about 12 min. You can leave this screen.'); render(); break;
    case 'revise': toast('Sent. The agent rewrites the script and asks you again.'); break;
    case 'notifopen': {const n=S.notif;S.notif=null; if(n&&n.dest) go(n.dest); else {go('making');} break;}
    case 'notifclose': S.notif=null; renderLayer(); break;
    case 'dialog': S.dialog=d.d; S.menu=null; render(); break;
    case 'dlgcancel': if(e.target===el||el.tagName==='BUTTON'){S.dialog=null;renderLayer();} break;
    case 'dlgok': {const k=S.dialog;S.dialog=null;
      if(k==='revoiceall'){snap('update voice-over');S.steps.forEach(s=>S.orig[s.id]=s.line);toast('Voice-over updated. The video is now 3:21.',true);}
      else if(k==='lineup'){snap('line up clicks');S.steps.forEach(s=>delete s.warn);toast('Sped up 0.4 s before 1 click. All clicks now land on their words.',true);}
      else if(k==='rebuild'){toast('Rebuilt the cursor and click effects. Your overlays were kept.',true);}
      else if(k==='rerecord'){toast('Recording again in the background. Your current video stays until the new one is ready.');}
      else if(k==='stop'){S.mk.need=null;toast('Stopped. Continue any time from Tutorials.');go('home');return;}
      render();break;}
    case 'undo': undo(); render(); break;
    case 'redo': redo(); render(); break;
    case 'menu': S.menu=S.menu===d.m?null:d.m; render(); break;
    case 'seek': S.t=+d.t+0.2; render(); break;
    case 'play': setPlay(!S.playing); break;
    case 'stepnav': {const i=S.steps.indexOf(stepAt(S.t));const j=Math.max(0,Math.min(S.steps.length-1,i+(+d.d)));S.t=S.steps[j].t+0.2;render();break;}
    case 'revoice': {const id=d.id;S.revoicing[id]=true;render();setTimeout(()=>{delete S.revoicing[id];snap('re-voice line');S.orig[id]=S.steps.find(s=>s.id===id).line;render();toast('Re-voiced. The video shifted by 0.8 s to fit the new words.',true);},1300);break;}
    case 'revert': {const s=S.steps.find(x=>x.id===d.id);s.line=S.orig[s.id];render();break;}
    case 'fixwarn': {snap('line up click');delete S.steps.find(x=>x.id===d.id).warn;render();toast('Sped up the wait before the click by 0.4 s.',true);break;}
    case 'preset': S.agent.text=d.p; S.menu=null; render(); const a=$('#ask'); if(a){a.focus();a.setSelectionRange(a.value.length,a.value.length);} break;
    case 'agsend': agentSend(); break;
    case 'agkeep': S.agent.state='idle'; S.agent.result=null; toast('Kept.'); render(); break;
    case 'agundo': {const r=S.agent.result; S.ovs=S.ovs.filter(o=>o.id!==r.ov); S.agent.state='idle'; S.agent.result=null; S.sel=null; toast('Undone. The video is back as it was.'); render(); break;}
    case 'agmore': S.agent.state='idle'; S.agent.text='Make the arrow '; render(); $('#ask')?.focus(); break;
    case 'notemode': S.noteMode=!S.noteMode; render(); if(S.noteMode) toast('Click on the video where you want the agent to look.'); break;
    case 'rmnote': S.agent.notes.splice(+d.i,1); render(); break;
    case 'addov': addOverlay(d.k); break;
    case 'del': {const s=S.sel; if(!s) return;
      if(s.kind==='ov'){const o=S.ovs.find(x=>x.id===s.id);snap(`delete ${OVNAME[o.type].toLowerCase()}`);S.ovs=S.ovs.filter(x=>x.id!==s.id);toast(`Deleted ${OVNAME[o.type].toLowerCase()}.`,true);}
      else if(s.kind==='clip'){const c=S.clips.find(x=>x.id===s.id);snap(c.kind==='ex'?'remove explainer':'cut');S.clips=S.clips.filter(x=>x.id!==s.id);toast(c.kind==='ex'?'Removed the explainer.':`Cut ${Math.round(c.e-c.s)} s from the video.`,true);}
      S.sel=null;render();break;}
    case 'ovdup': {const o=S.ovs.find(x=>x.id===S.sel.id);snap('duplicate');const n={...o,id:'o'+(nid++),x:o.x+3,y:o.y+3};S.ovs.push(n);S.sel={kind:'ov',id:n.id};render();toast('Duplicated.',true);break;}
    case 'ovcolor': {const o=S.ovs.find(x=>x.id===S.sel.id);snap('change colour');o.color=d.c;render();break;}
    case 'ovzoom': {const o=S.ovs.find(x=>x.id===S.sel.id);snap('change zoom');o.zoomLevel=+d.z;render();break;}
    case 'speed': {const c=S.clips.find(x=>x.id===S.sel.id);snap(`speed ${d.v}×`);c.speed=+d.v;render();toast(`This part now plays at ${d.v}×.`,true);break;}
    case 'split': {const c=S.clips.find(x=>S.t>x.s+0.5&&S.t<x.e-0.5&&x.kind==='rec');
      if(!c){toast('Move the playhead inside a recording part to split it.');break;}
      snap('split');const n={...c,id:'c'+(nid++),s:Math.round(S.t*10)/10};c.e=n.s;S.clips.splice(S.clips.indexOf(c)+1,0,n);S.sel={kind:'clip',id:n.id};render();toast(`Split at ${mmss(S.t)}.`,true);break;}
    case 'focusline': {const t=document.getElementById('ln-'+d.id);t&&t.focus();break;}
    case 'exstart': S.ex.state='running'; S.ex.p=0; clearInterval(exTimer); exTimer=setInterval(exTick,100); render(); break;
    case 'excancel': S.ex.state='idle'; clearInterval(exTimer); toast('Export cancelled. Nothing was overwritten.'); render(); break;
    case 'res': S.ex.res=d.v; render(); break;
    case 'savekey': S.setup.key=true; render(); toast('Key checked with ElevenLabs and saved.'); break;
    case 'copy': try{navigator.clipboard.writeText(d.c).then(()=>toast('Copied.'),()=>toast('Select the command and copy it.'));}catch(err){toast('Select the command and copy it.');} break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target, d=el.dataset;
  if(d.act==='captions'){S.captions=el.checked;renderLive();}
  else if(d.act==='lane'){S.lanes[d.k]=el.checked;render();}
  else if(d.act==='out'){S.ex.outs[d.k]=el.checked;render();}
  else if(d.act==='ovtime'){const o=S.ovs.find(x=>x.id===S.sel.id);snap('change timing');o[d.f]=Math.max(0,Math.min(DUR,+el.value||0));if(o.e<=o.s)o.e=o.s+0.5;render();}
  else if(d.act==='line'){render();}
});
document.addEventListener('input',e=>{
  const el=e.target, d=el.dataset;
  if(d.act==='line'||d.act==='rvline'){const s=S.steps.find(x=>x.id===d.id);s.line=el.value;if(d.act==='rvline'){S.orig[s.id]=s.line;return;}autosize(el);
    const acts=document.querySelector(`[data-acts="${d.id}"]`);const changed=S.orig[s.id]!==s.line;
    if(acts&&!S.revoicing[d.id]) acts.innerHTML=changed?`<span class="tag">Changed</span><button class="btn sm" data-act="revoice" data-id="${s.id}">Re-voice this line</button><button class="btn sm ghost" data-act="revert" data-id="${s.id}">Revert</button>`:'';}
  else if(d.act==='ovtext'){const o=S.ovs.find(x=>x.id===S.sel.id);o.text=el.value;renderLive();}
  else if(d.act==='zoom'){S.zoom=+el.value;const t=$('#track');if(t)t.style.width=S.zoom*100+'%';}
  else if(el.id==='ask'){S.agent.text=el.value;}
  else if(el.id==='goal'){S.goal=el.value;}
});
document.addEventListener('submit',e=>{
  if(e.target.dataset.form==='make'){e.preventDefault();const g=($('#goal').value||'').trim();
    if(!g){toast('Describe what the viewer should learn first.');$('#goal').focus();return;}
    if(S.how==='me'){toast('The product would open now for you to click through once. (Not in this prototype.)');return;}
    const title=g.charAt(0).toUpperCase()+g.slice(1);
    Object.assign(S.mk,{title,stage:0,pct:0,log:[],need:null,done:false,askedPerm:false});go('making');}
});
// timeline seek + preview drag + note mode
let drag=null;
document.addEventListener('pointerdown',e=>{
  const ruler=e.target.closest('[data-act="ruler"]');
  if(ruler&&!e.target.closest('.blk')){const tr=$('#track').getBoundingClientRect();S.t=Math.max(0,Math.min(DUR,(e.clientX-tr.left)/tr.width*DUR));S.sel=null;render();return;}
  const stage=e.target.closest('#stage'); if(!stage) return;
  const r=stage.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
  if(S.noteMode){S.agent.notes.push({t:S.t,x,y});S.noteMode=false;setPlay(false);render();toast(`Note added at ${mmss(S.t)}. Now say what you want in Ask the agent.`);$('#ask')?.focus();return;}
  const ovEl=e.target.closest('[data-ov]');
  if(ovEl){const o=S.ovs.find(z=>z.id===ovEl.dataset.ov);S.sel={kind:'ov',id:o.id};if(o.type!=='title'){snap(`move ${OVNAME[o.type].toLowerCase()}`);drag={o,dx:x-o.x,dy:y-o.y,r,moved:false};ovEl.setPointerCapture?.(e.pointerId);}render();e.preventDefault();}
  else if(S.sel&&S.sel.kind==='ov'){S.sel=null;render();}
});
document.addEventListener('pointermove',e=>{if(!drag)return;const {o,r}=drag;o.x=Math.max(0,Math.min(92,(e.clientX-r.left)/r.width*100-drag.dx));o.y=Math.max(0,Math.min(92,(e.clientY-r.top)/r.height*100-drag.dy));drag.moved=true;renderLive();});
document.addEventListener('pointerup',()=>{if(drag&&!drag.moved)S.undo.pop();drag=null;});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.dialog){S.dialog=null;renderLayer();}else if(S.menu){S.menu=null;render();}else if(S.drawer){S.drawer=false;renderLayer();}else if(S.noteMode){S.noteMode=false;render();}return;}
  if(S.view!=='studio') return;
  const typing=e.target.closest('input,textarea,select,[contenteditable]');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();render();return;}
  if(typing) return;
  if(e.key===' '){e.preventDefault();setPlay(!S.playing);}
  else if((e.key==='Delete'||e.key==='Backspace')&&S.sel&&S.sel.kind!=='line'){e.preventDefault();document.querySelector('[data-act="del"]')?.click();}
  else if(e.key==='ArrowLeft'){S.t=Math.max(0,S.t-1);renderLive();} else if(e.key==='ArrowRight'){S.t=Math.min(DUR,S.t+1);renderLive();}
});

// boot
mkTimer=setInterval(mkTick,180);
const startView=(location.hash||'').replace('#','');
if(['home','making','studio','export','setup'].includes(startView)) S.view=startView;
if(startView==='making') Object.assign(S.mk,{stage:0});
window.addEventListener('hashchange',()=>{const v=location.hash.replace('#','');if(['home','making','studio','export','setup'].includes(v)&&v!==S.view)go(v);});
render();
</script>
