[package]
name = "tutorial-studio"
version = "0.0.1"
description = "WSO2 Tutorial Studio"
edition = "2021"

[lib]
name = "tutorial_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
